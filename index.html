<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Side Scroller - Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading">INITIALIZING ENGINE...</div>
    <div id="overlay">
        <div class="hud-stack">
            <div class="health-panel" aria-label="Gel health">
                <div class="health-row">
                    <span class="health-label">GEL</span>
                    <span id="health-value">100%</span>
                </div>
                <div class="health-track" aria-hidden="true">
                    <div id="health-fill"></div>
                </div>
            </div>
        </div>
        <div id="coin-counter">COINS: <span id="coin-value">0</span></div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over">
        <div class="game-over-content">
            <h2>GEL DEPLETED</h2>
            <p>You lost too much of yourself to go on.</p>
            <button id="retry-btn">RETRY</button>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
