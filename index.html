<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Side Scroller - Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Outfit', sans-serif; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-weight: 700; letter-spacing: -0.02em; }
        .controls { margin-top: 10px; font-weight: 300; opacity: 0.8; }
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 2rem;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="loading">INITIALIZING ENGINE...</div>
    <div id="overlay">
        <h1>Side Scroller Template</h1>
        <div class="controls">WASD / Arrows to Move • Space to Jump</div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
